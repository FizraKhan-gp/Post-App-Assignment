<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <nav class="navbar bg-1 fg-2 bgColor ">
    <div class="container-fluid">
      <a class="navbar-brand text-white">SIT Post App</a>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
        <button class="btn bgColor text-white" type="submit">Search</button>
      </form>
    </div>
  </nav>
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-5 col-lg-4 mt-2">
        <div class="card">
          <!-- Content for the first column -->
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Title</label>
            <input type="text" id="title" class="form-control" placeholder="Enter your Title here:">
          </div>
          <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Description</label>
            <textarea class="form-control" id="desc" rows="3" placeholder="What's On your mind..."></textarea>
          </div>
          <button class="btn bgColor text-white postBtn" onclick="post()">Post</button>
        </div>
      </div>


      <div class="col-12 col-md-7 col-lg-8" id="postContainer">
        <!-- Content for the second column -->
      </div>
    </div>
  </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
